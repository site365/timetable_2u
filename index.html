<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>출근 시간표보기</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root{--ink:#334155;--muted:#7c8da3;--line:#d9e4ee;--bg:#f5f9fc;--card:#fff;--blue:#76a9d1;--blue2:#eaf4fb;--yellow:#fff6c9;--red:#e67878;--green:#8ebda7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}button,select,input{font:inherit;color:inherit}.wrap{max-width:1440px;margin:auto;padding:32px 24px 100px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.brand h1{margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:-.05em}.brand p{margin:10px 0 0;color:var(--muted)}.admin-badge{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:white;font-size:13px}.hero-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(82,119,148,.07)}.metric{padding:18px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:25px;margin-top:8px}.panel{padding:18px;margin-bottom:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar button,.toolbar input,.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.danger{color:var(--red)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head h2{font-size:18px;margin:0}.holiday-list{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--blue2);border:1px solid #d5e8f5;padding:7px 10px;border-radius:999px;font-size:13px}.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:14px}.schedule{width:100%;border-collapse:collapse;min-width:970px;table-layout:fixed}.schedule th,.schedule td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:10px 5px}.schedule th{background:#f8fbfd;font-size:13px}.schedule .name{position:sticky;left:0;background:#fff;font-weight:750;width:105px;z-index:2}.schedule td{height:58px;cursor:default}.schedule td.editable{cursor:pointer}.schedule td.editable:hover{outline:2px solid var(--blue);outline-offset:-2px}.schedule td.off{background:var(--yellow);color:#b97620;font-weight:750}.schedule td.leave{background:#eaf7f0;color:#4a8b6c;font-weight:750}.schedule td.issue{background:#fff0f0;color:#c75d5d;font-weight:750}.sun{color:#e67878}.sat{color:#62a9d8}.week-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 2px}.week-nav button{border:1px solid var(--line);background:white;border-radius:10px;padding:7px 12px}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.drop{min-height:210px;border:1px dashed #b9cddd;border-radius:15px;display:grid;place-items:center;text-align:center;background:#f9fcfe;padding:16px}.drop img{max-width:100%;max-height:390px;border-radius:10px}.ocr-log{white-space:pre-wrap;background:#f7fafc;border-radius:12px;padding:12px;min-height:100px;color:var(--muted);font-size:13px}.stats{width:100%;border-collapse:collapse;min-width:900px}.stats th,.stats td{padding:11px;border-bottom:1px solid var(--line);text-align:center}.stats th{color:var(--muted);font-size:12px}.analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.analysis{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfdff}.analysis strong{display:block;margin-bottom:8px}.analysis p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}.lock{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:1px solid #c9dce9;background:#fff;box-shadow:0 10px 30px rgba(54,92,120,.2);font-size:24px;cursor:pointer;z-index:20}.modal{position:fixed;inset:0;background:rgba(65,83,99,.32);display:none;place-items:center;z-index:30}.modal.open{display:grid}.dialog{background:#fff;border-radius:20px;padding:22px;width:min(92vw,390px);box-shadow:0 24px 70px rgba(30,50,70,.2)}.dialog h3{margin-top:0}.dialog input,.dialog select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;margin:7px 0}.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.hidden{display:none!important}@media(max-width:800px){.wrap{padding:22px 12px 90px}.hero-grid{grid-template-columns:1fr 1fr}.photo-grid,.analysis-grid{grid-template-columns:1fr}.top{display:block}.admin-badge{display:inline-block;margin-top:14px}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="brand"><h1>출근 시간표보기</h1><p>우리 회사 직원 출근시간, 휴무, 휴가, 연차, 반차 기록 보기</p></div><span class="admin-badge" id="adminState">열람 모드</span></header>
  <section class="hero-grid" id="summaryCards"></section>
  <section class="panel"><div class="toolbar"><button id="prevMonth">←</button><select id="year"></select><select id="month"></select><button id="nextMonth">→</button><button class="btn primary admin-only hidden" id="addHoliday">공휴일 추가</button><button class="btn admin-only hidden" id="addEmployee">직원 추가</button><button class="btn admin-only hidden" id="exportData">백업</button><label class="btn admin-only hidden">복원<input id="importData" type="file" accept="application/json" hidden></label></div></section>
  <section class="panel"><div class="section-head"><h2 id="holidayTitle">월별 주말·공휴일</h2></div><div class="holiday-list" id="holidayList"></div></section>
  <section class="panel"><div class="section-head"><h2 id="scheduleTitle">근무 시간표</h2><small id="editHint">관리자 로그인 후 수정할 수 있습니다.</small></div><div class="table-scroll"><table class="schedule" id="schedule"></table></div><div class="week-nav"><button id="prevWeek">이전 주</button><strong id="weekLabel"></strong><button id="nextWeek">다음 주</button></div></section>
  <section class="panel"><div class="section-head"><h2>이미지 시간표</h2><span class="chip">이미지 → OCR → 일정 반영</span></div><div class="photo-grid"><div class="drop" id="drop"><div><b>지배인/대표님 시간표 이미지</b><p>관리자 로그인 후 이미지 파일을 선택하세요.</p><input id="imageInput" type="file" accept="image/*" disabled><p><button class="btn primary admin-only hidden" id="runOcr">이미지 읽고 자동 반영</button></p></div></div><div><div class="ocr-log" id="ocrLog">저장된 이미지가 없습니다.</div></div></div></section>
  <section class="panel"><div class="section-head"><h2>직원별 월간 현황</h2><small>휴무 잔여 = 월 기본 휴무 − 사용 휴무</small></div><div class="table-scroll"><table class="stats" id="stats"></table></div></section>
  <section class="panel"><div class="section-head"><h2>근무 편중 분석</h2><label><input type="checkbox" id="analysisToggle" checked> 분석 보기</label></div><div class="analysis-grid" id="analysis"></div></section>
</main>
<button class="lock" id="lock" aria-label="관리자 로그인">🔒</button>
<div class="modal" id="loginModal"><div class="dialog"><h3>관리자 로그인</h3><p>관리자만 시간표와 직원 정보를 수정할 수 있습니다.</p><input id="pin" type="password" inputmode="numeric" placeholder="비밀번호"><div class="actions"><button class="btn" data-close>취소</button><button class="btn primary" id="login">로그인</button></div></div></div>
<div class="modal" id="editModal"><div class="dialog"><h3 id="editTitle">일정 수정</h3><select id="shiftSelect"></select><input id="memo" placeholder="메모 (선택)"><div class="actions"><button class="btn danger" id="clearShift">삭제</button><button class="btn" data-close>취소</button><button class="btn primary" id="saveShift">저장</button></div></div></div>
<script>
const EMPLOYEES=['임영준','박선영','최일웅','김정민','김은진','파트'];
const SHIFTS=['','7출','8출','9출','10출','11출','12출','13출','14출','15출','16출','9출~10출','휴무','연차','월차','반차(오전)','반차(오후)','병가','경조휴가','교육','지각','조퇴','결근','연장근무'];
const HOLIDAYS={'2026-08-15':'광복절','2026-08-17':'광복절 대체공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'개천절 대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절'};
const KEY='toyu-attendance-v2', IMGDB='toyu-attendance-images';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{employees:[...EMPLOYEES],records:{},customHolidays:{},monthlyOff:8};
let admin=sessionStorage.getItem('toyu-admin')==='1', now=new Date(), viewYear=2026, viewMonth=8, week=0, editing=null;
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0'), dateKey=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
function save(){localStorage.setItem(KEY,JSON.stringify(state))} function daysInMonth(y,m){return new Date(y,m,0).getDate()}
function combinedHolidays(){return {...HOLIDAYS,...state.customHolidays}}
function classify(v){if(/휴무/.test(v))return'off';if(/연차|월차|반차|병가|경조/.test(v))return'leave';if(/지각|조퇴|결근/.test(v))return'issue';return''}
function rec(name,key){return state.records[name+'|'+key]||{shift:'',memo:''}}
function setRec(name,key,value){state.records[name+'|'+key]=value;save()}
function initSelectors(){for(let y=2026;y<=2035;y++)$('#year').insertAdjacentHTML('beforeend',`<option>${y}</option>`);for(let m=1;m<=12;m++)$('#month').insertAdjacentHTML('beforeend',`<option value="${m}">${m}월</option>`);$('#year').value=viewYear;$('#month').value=viewMonth;SHIFTS.forEach(s=>$('#shiftSelect').add(new Option(s||'미지정',s)))}
function monthInfo(){let weekends=0,sat=0,sun=0;for(let d=1;d<=daysInMonth(viewYear,viewMonth);d++){let w=new Date(viewYear,viewMonth-1,d).getDay();if(w===0){sun++;weekends++}if(w===6){sat++;weekends++}}let h=Object.entries(combinedHolidays()).filter(([k])=>k.startsWith(`${viewYear}-${pad(viewMonth)}-`));return{weekends,sat,sun,h}}
function renderSummary(){let x=monthInfo(), used=state.employees.reduce((a,n)=>a+Object.keys(state.records).filter(k=>k.startsWith(n+'|'+viewYear+'-'+pad(viewMonth))&&/휴무/.test(state.records[k].shift)).length,0);$('#summaryCards').innerHTML=`<div class="metric"><small>주말</small><strong>${x.weekends}일</strong></div><div class="metric"><small>공휴일</small><strong>${x.h.length}일</strong></div><div class="metric"><small>등록 직원</small><strong>${state.employees.length}명</strong></div><div class="metric"><small>이번 달 휴무 사용</small><strong>${used}회</strong></div>`;$('#holidayTitle').textContent=`${viewYear}년 ${viewMonth}월 주말·공휴일`;$('#holidayList').innerHTML=`<span class="chip">토요일 ${x.sat}일</span><span class="chip">일요일 ${x.sun}일</span>`+(x.h.map(([d,n])=>`<span class="chip">${Number(d.slice(-2))}일 ${n}</span>`).join('')||'<span class="chip">등록된 공휴일 없음</span>')}
function renderSchedule(){let start=week*7+1, end=Math.min(start+6,daysInMonth(viewYear,viewMonth));if(start>daysInMonth(viewYear,viewMonth)){week=0;return renderSchedule()}let days=[];for(let d=start;d<=end;d++)days.push(d);let head=`<thead><tr><th class="name">직원</th>${days.map(d=>{let w=new Date(viewYear,viewMonth-1,d).getDay();return`<th class="${w===0?'sun':w===6?'sat':''}">${d}일<br>${'일월화수목금토'[w]}</th>`}).join('')}</tr></thead>`;let body=state.employees.map(n=>`<tr><td class="name">${n}</td>${days.map(d=>{let k=dateKey(viewYear,viewMonth,d),r=rec(n,k);return`<td data-name="${n}" data-date="${k}" class="${classify(r.shift)} ${admin?'editable':''}" title="${r.memo||''}">${r.shift||'—'}</td>`}).join('')}</tr>`).join('');$('#schedule').innerHTML=head+'<tbody>'+body+'</tbody>';$('#scheduleTitle').textContent=`${viewYear}년 ${viewMonth}월 근무 시간표`;$('#weekLabel').textContent=`${start}일 – ${end}일`;document.querySelectorAll('.editable').forEach(td=>td.onclick=()=>openEdit(td.dataset.name,td.dataset.date))}
function counts(name){let values=[];for(let d=1;d<=daysInMonth(viewYear,viewMonth);d++)values.push(rec(name,dateKey(viewYear,viewMonth,d)).shift);let c=q=>values.filter(v=>v.includes(q)).length;let half=c('반차');return{off:c('휴무'),annual:c('연차')+c('월차'),half,late:c('지각'),over:c('연장근무'),remain:Math.max(0,state.monthlyOff-c('휴무')),am:values.filter(v=>/^([7-9])출/.test(v)).length,pm:values.filter(v=>/^(1[2-6])출/.test(v)).length,worked:values.filter(v=>/출/.test(v)).length}}
function renderStats(){let rows=state.employees.map(n=>{let c=counts(n);return`<tr><td><b>${n}</b></td><td>${c.off}</td><td>${c.annual}</td><td>${c.half}</td><td>${c.late}</td><td>${c.over}</td><td><b>${c.remain}</b></td></tr>`}).join('');$('#stats').innerHTML='<thead><tr><th>직원</th><th>휴무</th><th>연차·월차</th><th>반차</th><th>지각</th><th>연장근무</th><th>남은 휴무</th></tr></thead><tbody>'+rows+'</tbody>'}
function renderAnalysis(){let html=state.employees.map(n=>{let c=counts(n),total=c.am+c.pm,ap=total?Math.round(c.am/total*100):0,pp=total?100-ap:0,msg;if(c.am>=4&&c.am>c.pm*1.7)msg=`오전 출근이 ${ap}%로 높습니다. 다음 배정에는 오후 출근 또는 충분한 휴식을 고려해 주세요.`;else if(c.pm>=4&&c.pm>c.am*1.7)msg=`오후 출근이 ${pp}%로 높습니다. 오전 근무와 균형을 검토해 주세요.`;else msg='현재 오전·오후 출근 비중이 비교적 고르게 배정되어 있습니다.';return`<article class="analysis"><strong>${n} · 오전 ${ap}% / 오후 ${pp}%</strong><p>${msg} 휴무 ${c.off}회, 잔여 휴무 ${c.remain}회입니다.</p></article>`}).join('');$('#analysis').innerHTML=html;$('#analysis').classList.toggle('hidden',!$('#analysisToggle').checked)}
function renderAdmin(){document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hidden',!admin));$('#imageInput').disabled=!admin;$('#adminState').textContent=admin?'관리자 편집 모드':'열람 모드';$('#lock').textContent=admin?'🔓':'🔒';$('#editHint').textContent=admin?'칸을 눌러 바로 수정하세요.':'관리자 로그인 후 수정할 수 있습니다.'}
function render(){renderSummary();renderSchedule();renderStats();renderAnalysis();renderAdmin()}
function openEdit(n,d){editing={n,d};let r=rec(n,d);$('#editTitle').textContent=`${n} · ${d}`;$('#shiftSelect').value=r.shift;$('#memo').value=r.memo;$('#editModal').classList.add('open')}
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('.modal').classList.remove('open'));
$('#lock').onclick=()=>{if(admin){admin=false;sessionStorage.removeItem('toyu-admin');render()}else $('#loginModal').classList.add('open')};$('#login').onclick=()=>{if($('#pin').value==='2222'){admin=true;sessionStorage.setItem('toyu-admin','1');$('#loginModal').classList.remove('open');$('#pin').value='';render()}else alert('비밀번호가 맞지 않습니다.')};
$('#saveShift').onclick=()=>{setRec(editing.n,editing.d,{shift:$('#shiftSelect').value,memo:$('#memo').value});$('#editModal').classList.remove('open');render()};$('#clearShift').onclick=()=>{delete state.records[editing.n+'|'+editing.d];save();$('#editModal').classList.remove('open');render()};
$('#prevWeek').onclick=()=>{week=Math.max(0,week-1);renderSchedule()};$('#nextWeek').onclick=()=>{if((week+1)*7<daysInMonth(viewYear,viewMonth))week++;renderSchedule()};function changeMonth(delta){let d=new Date(viewYear,viewMonth-1+delta,1);viewYear=d.getFullYear();viewMonth=d.getMonth()+1;week=0;$('#year').value=viewYear;$('#month').value=viewMonth;render()}$('#prevMonth').onclick=()=>changeMonth(-1);$('#nextMonth').onclick=()=>changeMonth(1);$('#year').onchange=e=>{viewYear=+e.target.value;week=0;render()};$('#month').onchange=e=>{viewMonth=+e.target.value;week=0;render()};
$('#addHoliday').onclick=()=>{let d=prompt('날짜를 입력하세요. 예: 2026-09-24');if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return;let n=prompt('공휴일 이름을 입력하세요.');if(n){state.customHolidays[d]=n;save();render()}};$('#addEmployee').onclick=()=>{let n=prompt('직원 이름');if(n&&!state.employees.includes(n)){state.employees.push(n);save();render()}};
$('#analysisToggle').onchange=renderAnalysis;$('#exportData').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=`출근시간표_${viewYear}_${pad(viewMonth)}.json`;a.click()};$('#importData').onchange=async e=>{try{state=JSON.parse(await e.target.files[0].text());save();render()}catch{alert('올바른 백업 파일이 아닙니다.')}};
function db(){return new Promise((ok,no)=>{let q=indexedDB.open(IMGDB,1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}async function saveImage(file){let d=await db();d.transaction('files','readwrite').objectStore('files').put(file,'latest')}async function loadImage(){let d=await db();return new Promise(ok=>{let q=d.transaction('files').objectStore('files').get('latest');q.onsuccess=()=>ok(q.result)})}function showImage(file){if(!file)return;let url=URL.createObjectURL(file);$('#drop').innerHTML=`<img src="${url}" alt="업로드한 시간표"><input id="imageInput" type="file" accept="image/*" class="hidden"><button class="btn primary admin-only ${admin?'':'hidden'}" id="runOcr">이미지 읽고 자동 반영</button>`;bindImage()}
function bindImage(){let input=$('#imageInput'),run=$('#runOcr');if(input)input.onchange=onImage;if(run)run.onclick=ocrImage}async function onImage(e){let f=e.target.files[0];if(f){await saveImage(f);showImage(f);$('#ocrLog').textContent='이미지가 저장되었습니다. OCR 버튼을 눌러주세요.'}}async function ocrImage(){let f=await loadImage();if(!f)return alert('이미지를 먼저 선택하세요.');$('#ocrLog').textContent='이미지를 읽는 중입니다…';try{let r=await Tesseract.recognize(f,'kor+eng',{logger:m=>{if(m.progress)$('#ocrLog').textContent=`이미지 분석 ${Math.round(m.progress*100)}%`}});let text=r.data.text;$('#ocrLog').textContent='인식 결과:\n'+text+'\n\n자동 반영은 표의 직원명·날짜·근무표기가 명확할 때 적용됩니다.';let lines=text.split(/\n/);state.employees.forEach(n=>{let line=lines.find(x=>x.includes(n));if(!line)return;let tokens=line.match(/(휴무|연차|월차|반차|[7-9]출|1[0-6]출)/g)||[];tokens.forEach((s,i)=>{let d=week*7+i+1;if(d<=daysInMonth(viewYear,viewMonth))setRec(n,dateKey(viewYear,viewMonth,d),{shift:s,memo:'이미지 OCR 자동 입력'})})});render()}catch(e){$('#ocrLog').textContent='이미지를 읽지 못했습니다. 인터넷 연결과 이미지 선명도를 확인해 주세요.'}}
initSelectors();bindImage();loadImage().then(showImage);render();
</script>
</body>
</html>
